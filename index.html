<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Enzo Ebendinger | Administrateur Systèmes & Réseaux</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/react@18/umd/react.production.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@babel/standalone/babel.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500;600;700&display=swap');
        
        :root {
            --bg-primary: #050510;
            --bg-secondary: #0a0b14;
            --bg-tertiary: #0f1118;
            --accent-cyan: #00f5d4;
            --accent-blue: #1e40af;
            --accent-purple: #8b5cf6;
            --text-primary: #ffffff;
            --text-secondary: #94a3b8;
            --border-subtle: rgba(148, 163, 184, 0.1);
            --glow-cyan: rgba(0, 245, 212, 0.3);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body { 
            background: var(--bg-primary);
            color: var(--text-primary); 
            font-family: 'Inter', -apple-system, sans-serif;
            overflow-x: hidden;
            cursor: none;
        }

        .cursor-dot {
            width: 10px; height: 10px;
            background: var(--accent-cyan);
            border-radius: 50%;
            position: fixed;
            pointer-events: none;
            z-index: 10000;
            mix-blend-mode: difference;
            transition: transform 0.15s ease-out, width 0.2s, height 0.2s;
        }
        .cursor-dot.hover { transform: scale(2.5); opacity: 0.6; }

        body::before {
            content: '';
            position: fixed;
            inset: 0;
            background: 
                linear-gradient(var(--bg-secondary) 1px, transparent 1px),
                linear-gradient(90deg, var(--bg-secondary) 1px, transparent 1px);
            background-size: 50px 50px;
            opacity: 0.3;
            animation: gridMove 20s linear infinite;
            pointer-events: none;
            z-index: 0;
        }
        @keyframes gridMove {
            0% { transform: translate(0, 0); }
            100% { transform: translate(50px, 50px); }
        }

        .focus-title {
            font-size: clamp(2rem, 5vw, 3.5rem);
            font-weight: 900;
            letter-spacing: -0.03em;
            background: linear-gradient(135deg, var(--text-primary) 0%, var(--accent-cyan) 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            position: relative;
            display: inline-block;
        }
        .focus-title::after {
            content: '';
            position: absolute;
            bottom: -8px;
            left: 0;
            width: 100%;
            height: 3px;
            background: linear-gradient(90deg, var(--accent-cyan), var(--accent-purple));
            animation: pulse 2s ease-in-out infinite;
        }
        @keyframes pulse {
            0%, 100% { opacity: 1; transform: scaleX(1); }
            50% { opacity: 0.5; transform: scaleX(0.95); }
        }

        .nav-container {
            background: rgba(10, 11, 20, 0.8);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid var(--border-subtle);
            border-radius: 999px;
            padding: 0.5rem;
        }
        .nav-btn {
            font-size: 0.75rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            color: var(--text-secondary);
            padding: 0.75rem 1.5rem;
            border-radius: 999px;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            cursor: pointer;
            position: relative;
            overflow: hidden;
        }
        .nav-btn:hover { color: var(--accent-cyan); }
        .nav-btn.active {
            color: var(--text-primary);
            background: linear-gradient(135deg, var(--accent-cyan), var(--accent-purple));
            box-shadow: 0 0 20px var(--glow-cyan);
        }

        .glass-card {
            background: linear-gradient(135deg, rgba(255,255,255,0.03) 0%, rgba(255,255,255,0.01) 100%);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid var(--border-subtle);
            border-radius: 24px;
            padding: 2rem;
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            position: relative;
            overflow: hidden;
        }
        .glass-card::before {
            content: '';
            position: absolute;
            inset: 0;
            background: radial-gradient(circle at 50% 0%, var(--glow-cyan), transparent 70%);
            opacity: 0;
            transition: opacity 0.4s;
        }
        .glass-card:hover {
            transform: translateY(-5px);
            border-color: var(--accent-cyan);
            box-shadow: 0 20px 60px rgba(0, 245, 212, 0.15);
        }
        .glass-card:hover::before { opacity: 0.1; }

        .logo-track {
            display: flex;
            animation: scroll 25s linear infinite;
            width: fit-content;
        }
        @keyframes scroll {
            0% { transform: translateX(0); }
            100% { transform: translateX(-50%); }
        }
        .logo-item {
            flex-shrink: 0;
            width: 140px;
            height: 80px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 1.5rem;
        }
        .logo-item img {
            max-height: 45px;
            width: auto;
            filter: grayscale(1) brightness(0.4) contrast(1.2);
            opacity: 0.5;
            transition: all 0.4s;
        }
        .logo-item:hover img {
            filter: grayscale(0) brightness(1) contrast(1);
            opacity: 1;
            transform: scale(1.15);
        }

        .bento-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 1.5rem;
        }
        .card-highlight {
            grid-column: 1 / -1;
            background: linear-gradient(135deg, rgba(139, 92, 246, 0.1) 0%, rgba(0, 245, 212, 0.05) 100%);
        }

        .skill-bar {
            height: 4px;
            background: var(--bg-tertiary);
            border-radius: 999px;
            overflow: hidden;
            position: relative;
        }
        .skill-fill {
            height: 100%;
            background: linear-gradient(90deg, var(--accent-cyan), var(--accent-purple));
            border-radius: 999px;
            transition: width 1s cubic-bezier(0.4, 0, 0.2, 1);
            box-shadow: 0 0 10px var(--glow-cyan);
        }

        .terminal {
            font-family: 'JetBrains Mono', monospace;
            background: var(--bg-tertiary);
            border: 1px solid var(--border-subtle);
            border-radius: 12px;
            padding: 1.5rem;
            position: relative;
        }
        .terminal::before {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0;
            height: 2px;
            background: linear-gradient(90deg, var(--accent-cyan), transparent);
            animation: scan 2s linear infinite;
        }
        @keyframes scan {
            0% { transform: translateX(-100%); }
            100% { transform: translateX(100%); }
        }
        .terminal-prompt { color: var(--accent-cyan); }
        .terminal-text { color: var(--text-secondary); }



        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(30px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .fade-in { animation: fadeInUp 0.6s ease-out forwards; }

        .status-dot {
            width: 12px;
            height: 12px;
            background: var(--accent-cyan);
            border-radius: 50%;
            animation: pulse-dot 2s infinite;
            box-shadow: 0 0 10px var(--glow-cyan);
        }
        @keyframes pulse-dot {
            0%, 100% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.5; transform: scale(1.2); }
        }

        @media (max-width: 768px) {
            .bento-grid { grid-template-columns: 1fr; }
            .focus-title { font-size: 2rem; }
            .music-player {
                width: 280px;
                bottom: 1rem;
                right: 1rem;
            }
        }
    </style>
</head>
<body>
    <div class="cursor-dot" id="cursor"></div>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef } = React;

        const CustomCursor = () => {
            useEffect(() => {
                const cursor = document.getElementById('cursor');
                const moveCursor = (e) => {
                    cursor.style.left = `${e.clientX}px`;
                    cursor.style.top = `${e.clientY}px`;
                };
                const hoverEffect = (e) => {
                    if (e.target.tagName === 'BUTTON' || e.target.classList.contains('nav-btn')) {
                        cursor.classList.add('hover');
                    } else {
                        cursor.classList.remove('hover');
                    }
                };
                document.addEventListener('mousemove', moveCursor);
                document.addEventListener('mouseover', hoverEffect);
                return () => {
                    document.removeEventListener('mousemove', moveCursor);
                    document.removeEventListener('mouseover', hoverEffect);
                };
            }, []);
            return null;
        };

        const LogoCarousel = () => {
            const logos = [
                { src: "https://upload.wikimedia.org/wikipedia/commons/6/64/Cisco_logo.svg", alt: "Cisco" },
                { src: "https://upload.wikimedia.org/wikipedia/commons/4/44/Microsoft_logo.svg", alt: "Microsoft" },
                { src: "https://upload.wikimedia.org/wikipedia/commons/6/66/Openlogo-debian.svg", alt: "Debian" },
                { src: "https://upload.wikimedia.org/wikipedia/commons/9/9a/Vmware.svg", alt: "VMware" },
                { src: "https://upload.wikimedia.org/wikipedia/commons/1/18/Wireshark_logo.svg", alt: "Wireshark" },
                { src: "https://upload.wikimedia.org/wikipedia/commons/d/d5/Virtualbox_logo.png", alt: "VirtualBox" },
                { src: "https://upload.wikimedia.org/wikipedia/commons/c/c3/Python-logo-notext.svg", alt: "Python" },
                { src: "https://upload.wikimedia.org/wikipedia/commons/0/05/Scrutiny_Logo.png", alt: "Scrutiny" }
            ];
            return (
                <div className="overflow-hidden py-8 relative">
                    <div className="logo-track">
                        {[...logos, ...logos].map((logo, i) => (
                            <div key={i} className="logo-item">
                                <img src={logo.src} alt={logo.alt} />
                            </div>
                        ))}
                    </div>
                </div>
            );
        };

        const SkillBar = ({ label, level, delay = 0 }) => {
            const [width, setWidth] = useState(0);
            useEffect(() => {
                setTimeout(() => setWidth(level), delay);
            }, [level, delay]);
            return (
                <div className="mb-4">
                    <div className="flex justify-between mb-2">
                        <span className="text-sm font-medium">{label}</span>
                        <span className="text-xs text-gray-400">{level}%</span>
                    </div>
                    <div className="skill-bar">
                        <div className="skill-fill" style={{ width: `${width}%` }} />
                    </div>
                </div>
            );
        };



        const App = () => {
            const [view, setView] = useState('accueil');
            const views = ['accueil', 'présentation', 'compétences', 'projets', 'veille', 'contact'];

            return (
                <>
                    <CustomCursor />
                    <div className="min-h-screen relative z-10">
                        <header className="sticky top-0 z-50 backdrop-blur-xl bg-opacity-80 py-6 px-6 md:px-12">
                            <div className="max-w-7xl mx-auto flex flex-col md:flex-row justify-between items-center gap-6">
                                <div className="flex items-center gap-4">
                                    <div className="status-dot"></div>
                                    <h1 className="focus-title">ENZO EBENDINGER</h1>
                                </div>
                                <nav className="nav-container flex flex-wrap gap-2">
                                    {views.map(v => (
                                        <span
                                            key={v}
                                            onClick={() => setView(v)}
                                            className={`nav-btn ${view === v ? 'active' : ''}`}
                                        >
                                            {v}
                                        </span>
                                    ))}
                                </nav>
                            </div>
                        </header>

                        <main className="max-w-7xl mx-auto px-6 md:px-12 py-12">
                            {view === 'accueil' && (
                                <div className="space-y-8 fade-in">
                                    <div className="glass-card card-highlight">
                                        <div className="flex items-start justify-between mb-6">
                                            <div>
                                                <p className="text-cyan-400 font-mono text-sm mb-2">$ whoami</p>
                                                <h2 className="text-5xl font-black mb-4 tracking-tight">
                                                    Administrateur Systèmes<br/>
                                                    <span className="text-transparent bg-clip-text bg-gradient-to-r from-cyan-400 to-purple-500">
                                                        & Réseaux
                                                    </span>
                                                </h2>
                                            </div>
                                            <div className="hidden md:block text-right">
                                                <div className="terminal text-xs">
                                                    <p className="terminal-prompt">root@portfolio:~#</p>
                                                    <p className="terminal-text">Status: Available</p>
                                                    <p className="terminal-text">Location: Strasbourg, FR</p>
                                                </div>
                                            </div>
                                        </div>
                                        <p className="text-xl text-gray-300 max-w-3xl leading-relaxed">
                                            Étudiant en <strong>BTS SIO option SISR</strong>, passionné par l'infrastructure IT, 
                                            la cybersécurité et l'automatisation. Spécialisé dans l'administration de 
                                            systèmes Windows/Linux et la gestion de réseaux Cisco.
                                        </p>
                                    </div>

                                    <div className="bento-grid">
                                        <div className="glass-card">
                                            <div className="text-4xl mb-4">🎯</div>
                                            <h3 className="text-lg font-bold mb-2">Objectif Professionnel</h3>
                                            <p className="text-sm text-gray-400">
                                                Devenir Administrateur Systèmes et Réseaux avec une expertise en sécurité des infrastructures critiques.
                                            </p>
                                        </div>
                                        <div className="glass-card">
                                            <div className="text-4xl mb-4">📍</div>
                                            <h3 className="text-lg font-bold mb-2">Localisation</h3>
                                            <p className="text-sm text-gray-400">
                                                Aux Alentour De Strasbourg<br/>
                                                Région Alsace, France
                                            </p>
                                        </div>
                                        <div className="glass-card">
                                            <div className="text-4xl mb-4">🚀</div>
                                            <h3 className="text-lg font-bold mb-2">Formation</h3>
                                            <p className="text-sm text-gray-400">
                                                BTS Services Informatiques<br/>
                                                SISR · 2024-2026
                                            </p>
                                        </div>
                                    </div>
                                </div>
                            )}

                            {view === 'présentation' && (
                                <div className="bento-grid fade-in">
                                    <div className="glass-card card-highlight">
                                        <h2 className="text-3xl font-bold mb-8 flex items-center gap-3">
                                            <span className="text-4xl">🎓</span>
                                            Parcours Académique
                                        </h2>
                                        <div className="space-y-6">
                                            <div className="border-l-4 border-cyan-400 pl-6 py-4">
                                                <h3 className="text-xl font-bold text-cyan-400">BTS SIO SISR</h3>
                                                <p className="text-gray-400 text-sm mt-1">2024 - 2026 · En cours</p>
                                                <p className="text-gray-300 mt-3">
                                                    Formation approfondie en administration systèmes (Windows Server, Linux), 
                                                    gestion de réseaux (Cisco, VLANs, VPN) et sécurité des infrastructures.
                                                </p>
                                            </div>
                                            <div className="border-l-4 border-purple-500 pl-6 py-4 opacity-70">
                                                <h3 className="text-xl font-bold">Baccalauréat Général</h3>
                                                <p className="text-gray-400 text-sm mt-1">Spécialités Scientifiques</p>
                                                <p className="text-gray-300 mt-3">
                                                    Formation scientifique solide avec spécialités orientées vers les sciences 
                                                    et les technologies.
                                                </p>
                                            </div>
                                        </div>
                                    </div>

                                    <div className="glass-card">
                                        <h2 className="text-2xl font-bold mb-6">Soft Skills</h2>
                                        <div className="grid grid-cols-2 gap-4">
                                            {[
                                                { icon: '🛡️', label: 'Rigueur', desc: 'Méthodique' },
                                                { icon: '🚀', label: 'Autonomie', desc: 'Proactif' },
                                                { icon: '🔍', label: 'Curiosité', desc: 'Apprenant' },
                                                { icon: '🤝', label: 'Équipe', desc: 'Collaboratif' }
                                            ].map((skill, i) => (
                                                <div key={i} className="bg-white bg-opacity-5 p-4 rounded-xl text-center hover:bg-opacity-10 transition-all">
                                                    <div className="text-3xl mb-2">{skill.icon}</div>
                                                    <div className="font-bold text-sm">{skill.label}</div>
                                                    <div className="text-xs text-gray-400">{skill.desc}</div>
                                                </div>
                                            ))}
                                        </div>
                                    </div>
                                </div>
                            )}

                            {view === 'compétences' && (
                                <div className="space-y-8 fade-in">
                                    <div className="bento-grid">
                                        {[
                                            { 
                                                icon: '🖥️', 
                                                title: 'Systèmes d\'Exploitation',
                                                skills: ['Windows Server (AD, GPO, DNS, DHCP)', 'Linux Debian/Ubuntu', 'Services réseau (Apache, NGINX)', 'Virtualisation (VMware, VirtualBox)']
                                            },
                                            { 
                                                icon: '🌐', 
                                                title: 'Réseaux & Infrastructure',
                                                skills: ['Configuration Cisco (VLAN, routage)', 'VPN (OpenVPN, IPsec)', 'Firewalling et règles NAT', 'Analyse de trafic (Wireshark)']
                                            },
                                            { 
                                                icon: '🔐', 
                                                title: 'Sécurité & Durcissement',
                                                skills: ['Stratégies de sauvegarde (3-2-1)', 'Gestion des droits (ACL, RBAC)', 'Hardening de systèmes', 'Veille en cybersécurité']
                                            },
                                            { 
                                                icon: '⚙️', 
                                                title: 'Outils & Scripting',
                                                skills: ['PowerShell / Bash scripting', 'GLPI (gestion de parc)', 'Python (automatisation)', 'Git & documentation']
                                            }
                                        ].map((cat, i) => (
                                            <div key={i} className="glass-card">
                                                <div className="text-4xl mb-4">{cat.icon}</div>
                                                <h3 className="text-lg font-bold mb-4 text-cyan-400">{cat.title}</h3>
                                                <ul className="space-y-2">
                                                    {cat.skills.map((skill, j) => (
                                                        <li key={j} className="text-sm text-gray-300 flex items-start gap-2">
                                                            <span className="text-cyan-400 mt-1">▸</span>
                                                            <span>{skill}</span>
                                                        </li>
                                                    ))}
                                                </ul>
                                            </div>
                                        ))}
                                    </div>

                                    <div className="glass-card">
                                        <h3 className="text-2xl font-bold mb-6 text-center">Niveaux de Maîtrise</h3>
                                        <div className="grid md:grid-cols-2 gap-6">
                                            <div>
                                                <SkillBar label="Windows Server" level={85} delay={100} />
                                                <SkillBar label="Linux (Debian/Ubuntu)" level={75} delay={200} />
                                                <SkillBar label="Réseaux Cisco" level={80} delay={300} />
                                                <SkillBar label="PowerShell" level={70} delay={400} />
                                            </div>
                                            <div>
                                                <SkillBar label="Active Directory" level={85} delay={100} />
                                                <SkillBar label="VPN & Sécurité" level={75} delay={200} />
                                                <SkillBar label="Virtualisation" level={80} delay={300} />
                                                <SkillBar label="Documentation" level={90} delay={400} />
                                            </div>
                                        </div>
                                    </div>

                                    <div className="glass-card card-highlight">
                                        <h3 className="text-xl font-bold mb-6 text-center">Technologies Maîtrisées</h3>
                                        <LogoCarousel />
                                    </div>
                                </div>
                            )}

                            {view === 'projets' && (
                                <div className="space-y-8 fade-in">
                                    <div className="glass-card card-highlight">
                                        <h2 className="text-3xl font-bold mb-8 flex items-center gap-3">
                                            <span className="text-4xl">🧪</span>
                                            Situations Professionnelles
                                        </h2>
                                        <div className="grid md:grid-cols-2 gap-6">
                                            <div className="bg-white bg-opacity-5 p-6 rounded-2xl border border-cyan-400 border-opacity-30">
                                                <h3 className="text-xl font-bold text-cyan-400 mb-3">Segmentation Réseau Avancée</h3>
                                                <p className="text-gray-300 mb-4">
                                                    Conception et déploiement d'une architecture réseau segmentée avec VLANs pour 
                                                    isoler les flux métier, routage inter-VLAN sécurisé et ACLs sur switches Cisco.
                                                </p>
                                                <div className="flex flex-wrap gap-2">
                                                    <span className="px-3 py-1 bg-cyan-400 bg-opacity-20 rounded-full text-xs font-mono">VLANs</span>
                                                    <span className="px-3 py-1 bg-cyan-400 bg-opacity-20 rounded-full text-xs font-mono">Cisco IOS</span>
                                                    <span className="px-3 py-1 bg-cyan-400 bg-opacity-20 rounded-full text-xs font-mono">Sécurité</span>
                                                </div>
                                            </div>
                                            <div className="bg-white bg-opacity-5 p-6 rounded-2xl border border-purple-500 border-opacity-30">
                                                <h3 className="text-xl font-bold text-purple-400 mb-3">Migration Active Directory</h3>
                                                <p className="text-gray-300 mb-4">
                                                    Planification et exécution d'une migration AD DS avec transfert des rôles FSMO, 
                                                    réplication des données et validation de la continuité de service.
                                                </p>
                                                <div className="flex flex-wrap gap-2">
                                                    <span className="px-3 py-1 bg-purple-500 bg-opacity-20 rounded-full text-xs font-mono">AD DS</span>
                                                    <span className="px-3 py-1 bg-purple-500 bg-opacity-20 rounded-full text-xs font-mono">FSMO</span>
                                                    <span className="px-3 py-1 bg-purple-500 bg-opacity-20 rounded-full text-xs font-mono">PowerShell</span>
                                                </div>
                                            </div>
                                        </div>
                                    </div>

                                    <div className="bento-grid">
                                        <div className="glass-card card-highlight">
                                            <h2 className="text-3xl font-bold mb-8 flex items-center gap-3">
                                                <span className="text-4xl">🏢</span>
                                                Expériences en Stage
                                            </h2>
                                            <div className="space-y-6">
                                                <div className="border-l-4 border-cyan-400 pl-6 py-4">
                                                    <h3 className="text-xl font-bold">Technicien Support & Maintenance</h3>
                                                    <p className="text-gray-400 text-sm mt-1 mb-3">Stage 1 · Infrastructure IT</p>
                                                    <ul className="space-y-2 text-gray-300">
                                                        <li className="flex items-start gap-2">
                                                            <span className="text-cyan-400">•</span>
                                                            Gestion d'un parc de 50+ postes de travail Windows
                                                        </li>
                                                        <li className="flex items-start gap-2">
                                                            <span className="text-cyan-400">•</span>
                                                            Déploiement d'images système via WDS
                                                        </li>
                                                        <li className="flex items-start gap-2">
                                                            <span className="text-cyan-400">•</span>
                                                            Documentation technique et procédures
                                                        </li>
                                                    </ul>
                                                </div>
                                                <div className="border-l-4 border-purple-500 pl-6 py-4">
